name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Chrome MV3)
        run: yarn build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node --test executes the TypeScript test files directly via Node's
      # native type stripping, which needs a newer Node than the build job.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Run tests
        # yarn test = node --test with the tests/_alias.mjs import hook that
        # resolves the project's @/ alias for direct-from-source unit tests.
        run: yarn test
