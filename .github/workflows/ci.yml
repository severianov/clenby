name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node ≥23.6 matches the root engines field (node --test runs the .ts
      # test files via native type stripping, stable from 23.6).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (Chrome MV3)
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node --test executes the TypeScript test files directly via Node's
      # native type stripping, which needs a newer Node than the build job.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        # npm test = node --test with the tests/_alias.mjs import hook that
        # resolves the project's @/ alias for direct-from-source unit tests.
        # Scoped to tests/ — the bridge suite has its own job below with its
        # own dependency install (its node_modules are separate).
        run: npm test

  bridge:
    name: Bridge tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The npm package claims engines >=18.14.1 — prove it on every push.
        node: [18, 20, 24]
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test
